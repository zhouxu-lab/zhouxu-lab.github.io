  <style>
    body {
        font-family: 'Roboto', sans-serif;
        font-size: 16px;
        color: #424242;
    }
    h1, h2, h3, h4, h5, h6 {

    }
    .navbar {
        border-bottom: 1px solid #e0e0e0;
        background-color: #fafafa !important;
    }
    /* Progress bar styles */
    progress {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 5px;
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        border: none;
        background-color: transparent;
        color: #0277bd;
        z-index: 1040;
    }
    progress::-webkit-progress-bar {
        background-color: transparent;
    }
    progress::-webkit-progress-value {
        background-color: #0277bd;
    }
    progress::-moz-progress-bar {
        background-color: #0277bd;
    }
    .content {
        max-width: 800px;
        margin: 0 auto;
        padding: 0 15px;
    }
    .contact-icon a {
        font-size: 1.5rem;
        margin-right: 10px;

    }
    .contact-icon a:hover {

    }
    .nav-link {
        color: #424242 !important;
    }
    .nav-item.navbar-active .nav-link {
        color: #000 !important;

    footer {
        text-align: center;
        padding: 20px 0;
        font-size: 0.9rem;
        color: #757575;
        margin-top: 40px;
        border-top: 1px solid #eee;
    }
    
    /* Publication specific styles */
    .year-heading {
        margin-top: 2rem;
        margin-bottom: 1rem;
        border-bottom: 1px solid #e0e0e0;
        padding-bottom: 0.5rem;
        color: #0277bd;
        font-size: 1.5rem;
    }
    .publication-entry {
        margin-bottom: 1rem;
        line-height: 1.6;
        font-size: 1rem;
        text-align: justify;
    }
    .pdf-link {
        color: #d32f2f;
        font-weight: 500;
        margin-left: 3px;
    }
    .pdf-link:hover {
        text-decoration: underline;
        color: #b71c1c;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <nav id="navbar" class="navbar fixed-top navbar-expand-md grey lighten-5 z-depth-1 navbar-light">
    <div class="container-fluid p-0">
      
        <div class="row ml-1 ml-sm-0">
          <span class="contact-icon text-center" style="line-height: 1em;">
            <a href="mailto:pxzhou@ucdavis.edu"><i class="fa fa-envelope-square gm-icon"></i></a>
            <a href="https://scholar.google.com/citations?user=ljrYzUwAAAAJ&hl=en" target="_blank" title="Google Scholar"><i class="ai ai-google-scholar-square gs-icon"></i></a>
            <a href="https://github.com/zhouxu-lab" target="_blank" title="GitHub"><i class="fab fa-github-square gh-icon"></i></a>
            <a href="https://www.linkedin.com/in/xu-zhou-a86939203/" target="_blank" title="LinkedIn"><i class="fab fa-linkedin li-icon"></i></a>
          </span>
        </div>
      
      <button class="navbar-toggler ml-auto" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse text-right" id="navbarNav">
        <ul class="navbar-nav ml-auto flex-nowrap">
          <li class="nav-item ">
            <a class="nav-link" href="/">

          <li class="nav-item navbar-active font-weight-bold">
              <a class="nav-link" href="/publications/">

          <li class="nav-item ">
              <a class="nav-link" href="/team/">

          </li>

              <a class="nav-link" href="/positions/">
                Available Positions
              </a>
          </li>
        </ul>
      </div>
    </div>

  <!-- Scrolling Progress Bar -->
  <progress id="progress" value="0">
    <div class="progress-container">
      <span class="progress-bar"></span>
    </div>
  </progress>

  <!-- Content -->
  <div class="content">
    <div class="col p-0 pt-4 pb-4">
      <h1 class="title text-left font-weight-bold">Publications</h1>

    &copy; Copyright 2026 Xu Zhou

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.1/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mdbootstrap/4.20.0/js/mdb.min.js"></script>
  <script src="/assets/js/theme-loader.js"></script>
  <script src="/assets/js/content-loader.js"></script>
  <script src="https://unpkg.com/imagesloaded@4/imagesloaded.pkgd.min.js"></script>

  <script type="text/javascript">
    $(document).ready(function() {
      var navbarHeight = $('#navbar').outerHeight(true);
      $('body').css({ 'padding-top': navbarHeight });
      
      var progressBar = $('#progress');
      progressBar.css({ 'top': navbarHeight });
      var getMax = function() { return $(document).height() - $(window).height(); }
      var getValue = function() { return $(window).scrollTop(); }   
      
      if ('max' in document.createElement('progress')) {
        progressBar.attr({ max: getMax() });
        progressBar.attr({ value: getValue() });
      
        $(document).on('scroll', function() {
          progressBar.attr({ value: getValue() });
        });

        $(window).resize(function() {
          var navbarHeight = $('#navbar').outerHeight(true);
          $('body').css({ 'padding-top': navbarHeight });
          progressBar.css({ 'top': navbarHeight });
          progressBar.attr({ max: getMax(), value: getValue() });
        });
      }
    });
  </script>
</body>
</html>
